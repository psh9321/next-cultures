name: Test and deploy to EC2

on:
  push:
    branches: [master]
    paths-ignore:
      - '**/[Rr][Ee][Aa][Dd][Mm][Ee]*'
  pull_request:
    branches: [master]
    paths-ignore:
      - '**/[Rr][Ee][Aa][Dd][Mm][Ee]*'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: 소스 코드 체크아웃
        uses: actions/checkout@v4
      - name: pnpm 설정
        uses: pnpm/action-setup@v4
        with:
          version: 10.2.0
      - name: Node.js 설정
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - name: 의존성 설치
        run: pnpm install --frozen-lockfile
      - name: 테스트 실행
        run: pnpm test

  deploy:
    needs: test
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    concurrency:
      group: ec2-production
      cancel-in-progress: false
    env:
      EC2_HOST: ${{ secrets.EC2_HOST }}
      EC2_USER: ${{ secrets.EC2_USER }}
      EC2_DEPLOY_PATH: ${{ secrets.EC2_DEPLOY_PATH }}
    steps:
      - name: 소스 코드 체크아웃
        uses: actions/checkout@v4
      - name: SSH 설정
        env:
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
          EC2_KNOWN_HOSTS: ${{ secrets.EC2_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          : "${EC2_HOST:?Set EC2_HOST}"
          : "${EC2_USER:?Set EC2_USER}"
          : "${EC2_DEPLOY_PATH:?Set EC2_DEPLOY_PATH}"
          : "${EC2_SSH_KEY:?Set EC2_SSH_KEY}"
          : "${EC2_KNOWN_HOSTS:?Set EC2_KNOWN_HOSTS}"
          [[ "$EC2_DEPLOY_PATH" == /* && "$EC2_DEPLOY_PATH" != / ]]
          install -m 700 -d ~/.ssh
          printf '%s\n' "$EC2_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$EC2_KNOWN_HOSTS" > ~/.ssh/known_hosts
      - name: EC2에 코드 배포
        run: |
          set -euo pipefail
          printf -v remote_path '%q' "$EC2_DEPLOY_PATH"
          ssh -o BatchMode=yes "$EC2_USER@$EC2_HOST" "mkdir -p -- $remote_path"
          rsync -az --delete -e 'ssh -o BatchMode=yes' \
            --exclude='.git/' \
            --exclude='.github/' \
            --exclude='.env*' \
            --exclude='node_modules/' \
            --exclude='.next/' \
            --exclude='.pnpm-store/' \
            ./ "$EC2_USER@$EC2_HOST:$remote_path/"
      - name: EC2에서 빌드 및 재시작
        run: |
          set -euo pipefail
          printf -v remote_path '%q' "$EC2_DEPLOY_PATH"
          ssh -o BatchMode=yes "$EC2_USER@$EC2_HOST" "bash -l -s -- $remote_path" <<'REMOTE'
          set -euo pipefail
          cd -- "$1"
          pnpm install --frozen-lockfile
          pnpm build
          pnpm reload --env production --update-env
          REMOTE
