name: Test and deploy to EC2

on:
  push:
    branches: [master]
    paths-ignore:
      - '**/[Rr][Ee][Aa][Dd][Mm][Ee]*'
  pull_request:
    branches: [master]
    paths-ignore:
      - '**/[Rr][Ee][Aa][Dd][Mm][Ee]*'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: 소스 코드 체크아웃
        uses: actions/checkout@v4
      - name: pnpm 설정
        uses: pnpm/action-setup@v4
        with:
          version: 10.2.0
      - name: Node.js 설정
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - name: 의존성 설치
        run: pnpm install --frozen-lockfile
      - name: 테스트 실행
        run: pnpm test

  deploy:
    needs: test
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    concurrency:
      group: ec2-production
      cancel-in-progress: false
    env:
      EC2_HOST: ${{ secrets.EC2_HOST }}
      EC2_USER: ${{ secrets.EC2_USER }}
      EC2_DEPLOY_PATH: ${{ secrets.EC2_DEPLOY_PATH }}
    steps:
      - name: SSH 설정
        env:
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
        run: |
          set -euo pipefail
          : "${EC2_HOST:?Set EC2_HOST}"
          : "${EC2_USER:?Set EC2_USER}"
          : "${EC2_DEPLOY_PATH:?Set EC2_DEPLOY_PATH}"
          : "${EC2_SSH_KEY:?Set EC2_SSH_KEY}"
          [[ "$EC2_DEPLOY_PATH" == /* && "$EC2_DEPLOY_PATH" != / ]]
          install -m 700 -d ~/.ssh
          printf '%s\n' "$EC2_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -T 10 -H "$EC2_HOST" > ~/.ssh/known_hosts
          test -s ~/.ssh/known_hosts
      - name: EC2에서 코드 업데이트, 빌드 및 재시작
        run: |
          set -euo pipefail
          printf -v remote_path '%q' "$EC2_DEPLOY_PATH"
          ssh -o BatchMode=yes "$EC2_USER@$EC2_HOST" "bash -l -s -- $remote_path" <<'REMOTE'
          set -euo pipefail
          cd -- "$1"
          sudo -n git rev-parse --is-inside-work-tree
          [[ "$(sudo -n git branch --show-current)" == master ]]
          sudo -n env GIT_TERMINAL_PROMPT=0 git pull --ff-only origin master
          sudo -n env "PATH=$PATH" COREPACK_ENABLE_DOWNLOAD_PROMPT=0 corepack pnpm --version
          sudo -n env "PATH=$PATH" COREPACK_ENABLE_DOWNLOAD_PROMPT=0 corepack pnpm install --frozen-lockfile
          sudo -n env "PATH=$PATH" COREPACK_ENABLE_DOWNLOAD_PROMPT=0 corepack pnpm build
          COREPACK_ENABLE_DOWNLOAD_PROMPT=0 corepack pnpm reload --env production --update-env
          REMOTE

  notify:
    needs: [test, deploy]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - name: Discord에 CI/CD 결과 알림
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          TEST_RESULT: ${{ needs.test.result }}
          DEPLOY_RESULT: ${{ needs.deploy.result }}
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.head_ref || github.ref_name }}
        run: |
          set -euo pipefail
          if [[ -z "$DISCORD_WEBHOOK_URL" ]]; then
            echo '::error::GitHub 저장소 Settings → Secrets and variables → Actions에 DISCORD_WEBHOOK_URL Secret을 등록해야 합니다.'
            exit 1
          fi
          if [[ "$DISCORD_WEBHOOK_URL" == */github || "$DISCORD_WEBHOOK_URL" == */github/ ]]; then
            echo '::error::DISCORD_WEBHOOK_URL에는 /github를 붙이지 않은 Discord 원본 웹훅 URL을 등록해야 합니다.'
            exit 1
          fi

          if [[ "$TEST_RESULT" == failure || "$DEPLOY_RESULT" == failure ]]; then
            title='❌ CI/CD 실패'
            color=15158332
          elif [[ "$TEST_RESULT" == cancelled || "$DEPLOY_RESULT" == cancelled ]]; then
            title='⏹️ CI/CD 취소'
            color=9807270
          elif [[ "$TEST_RESULT" == success && ( "$EVENT_NAME" != push || "$DEPLOY_RESULT" == success ) ]]; then
            title='✅ CI/CD 성공'
            color=3066993
          else
            title='⚠️ CI/CD 미완료'
            color=16776960
          fi

          run_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          payload=$(jq -n \
            --arg title "$title" \
            --argjson color "$color" \
            --arg url "$run_url" \
            --arg repository "$GITHUB_REPOSITORY" \
            --arg branch "$REF_NAME" \
            --arg commit "${GITHUB_SHA:0:7}" \
            --arg test "$TEST_RESULT" \
            --arg deploy "$DEPLOY_RESULT" \
            '{allowed_mentions: {parse: []}, embeds: [{title: $title, color: $color, url: $url, fields: [
              {name: "저장소", value: $repository},
              {name: "브랜치", value: $branch, inline: true},
              {name: "커밋", value: $commit, inline: true},
              {name: "테스트", value: $test, inline: true},
              {name: "배포", value: $deploy, inline: true}
            ]}]}')
          curl --fail-with-body --silent --show-error \
            --connect-timeout 10 --max-time 30 \
            -H 'Content-Type: application/json' \
            --data "$payload" "$DISCORD_WEBHOOK_URL"
          echo 'Discord CI/CD 결과 알림 전송 완료'
